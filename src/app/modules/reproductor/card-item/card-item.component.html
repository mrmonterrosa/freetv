<div 
  class="channel-card" 
  [class.active]="isSelected"
  (click)="redirectTo(data.id)"
  role="button"
  [attr.aria-label]="data.title">

  <!-- Channel Logo / Avatar -->
  <div class="channel-logo-wrapper">
    <img 
      *ngIf="!imageError && data.thumb_square" 
      [src]="data.thumb_square" 
      [alt]="data.title || 'Canal'"
      class="channel-logo-img"
      (error)="onImageError()"
      loading="lazy">
    
    <!-- Fallback Avatar -->
    <div *ngIf="imageError || !data.thumb_square" class="channel-logo-fallback">
      <i class="bi bi-tv"></i>
    </div>
  </div>

  <!-- Channel Info -->
  <div class="channel-info">
    <div class="channel-title" [title]="data.title">{{ data.title }}</div>
    <div class="channel-meta">
      <span *ngIf="data.group" class="badge-tag group-tag">
        <i class="bi bi-tag-fill me-1"></i>{{ data.group }}
      </span>
      <span *ngIf="data.country" class="badge-tag country-tag">
        <i class="bi bi-geo-alt-fill me-1"></i>{{ data.country }}
      </span>
    </div>
  </div>

  <!-- Right Actions & Live Status -->
  <div class="channel-actions">
    <button 
      type="button" 
      class="btn-fav" 
      [class.is-fav]="isFavorite"
      (click)="toggleFav($event)"
      [title]="isFavorite ? 'Quitar de favoritos' : 'Agregar a favoritos'">
      <i class="bi" [ngClass]="isFavorite ? 'bi-heart-fill text-amber' : 'bi-heart'"></i>
    </button>
    <div *ngIf="isSelected" class="live-pill">
      <span class="live-pulse-dot"></span>
      <span>ON</span>
    </div>
  </div>
</div>
